<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="aiadoptlabs.com belongs to Goutam Mukku.">
<title>AI Adopt Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
/* Layout: one screen. A painted veil (red sun, samurai, kanji) is cut on the diagonal; its halves fall away to reveal the ownership card. */
:root {
  --ink: #0e0d10;
  --ink-2: #17151a;
  --steel: #e4e6ea;
  --mist: #8d8a93;
  --crimson: #c4122f;
  --crimson-deep: #7d0b1e;
  --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--steel);
  font-family: var(--body);
  overflow: hidden;
}
.stage {
  position: relative;
  height: 100%;
  min-height: 420px;
  overflow: hidden;
  isolation: isolate;
}

/* The card underneath */
.content {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 2rem;
  text-align: center;
  background:
    radial-gradient(ellipse 60% 45% at 50% 50%, rgba(196, 18, 47, 0.10), transparent 70%),
    var(--ink);
}
.card { display: grid; gap: 1.1rem; justify-items: center; max-width: 40rem; }
.domain {
  font-family: var(--body);
  font-size: 0.8rem;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--mist);
}
.lead {
  font-family: var(--display);
  font-weight: 500;
  font-size: clamp(1.1rem, 3.4vw, 1.6rem);
  color: var(--mist);
  text-wrap: balance;
}
.owner {
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(2.6rem, 10vw, 5.5rem);
  line-height: 1.02;
  letter-spacing: 0.01em;
  text-wrap: balance;
}
.rule {
  width: min(14rem, 50vw);
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--crimson), transparent);
}
.seal {
  display: inline-grid;
  place-items: center;
  width: 3.2rem;
  height: 3.2rem;
  border: 2px solid var(--crimson);
  border-radius: 6px;
  color: var(--crimson);
  font-family: var(--display);
  font-weight: 800;
  font-size: 1.7rem;
  transform: rotate(-4deg);
}
.gloss { font-size: 0.78rem; color: var(--mist); letter-spacing: 0.06em; }

/* The veil that gets cut */
.half {
  position: absolute;
  inset: 0;
  background: var(--ink-2);
  will-change: transform, opacity;
}
.half svg { width: 100%; height: 100%; display: block; }
.half.a { clip-path: polygon(0 0, 100% 0, 0 100%); }
.half.b { clip-path: polygon(100% 0, 100% 100%, 0 100%); }

.slash {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  filter: drop-shadow(0 0 6px rgba(228, 230, 234, 0.9)) drop-shadow(0 0 18px rgba(196, 18, 47, 0.7));
}
.slash line { stroke: var(--steel); stroke-width: 2.5; stroke-dasharray: 1; stroke-dashoffset: 1; }
.flash { position: absolute; inset: 0; background: var(--steel); opacity: 0; pointer-events: none; }

.katana { transform-box: fill-box; transform-origin: 0% 100%; }

/* Sequence */
.content .card { opacity: 0; transform: translateY(14px); }
.go .katana { animation: swing 0.22s 0.5s cubic-bezier(0.8, 0, 0.3, 1) forwards; }
.go .slash line { animation: draw 0.32s 0.62s cubic-bezier(0.7, 0, 0.2, 1) forwards; }
.go .flash { animation: flash 0.3s 0.92s ease-out; }
.go .half.a { animation: fall-a 1s 1.1s cubic-bezier(0.55, 0, 0.2, 1) forwards; }
.go .half.b { animation: fall-b 1s 1.1s cubic-bezier(0.55, 0, 0.2, 1) forwards; }
.go .slash { animation: fade-scar 0.8s 1.6s ease forwards; }
.go .content .card { animation: rise 0.8s 1.5s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; }

@keyframes swing { to { transform: rotate(118deg); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes flash { 0% { opacity: 0; } 30% { opacity: 0.35; } 100% { opacity: 0; } }
@keyframes fall-a { to { transform: translate(-18%, -18%) rotate(-5deg); opacity: 0; visibility: hidden; } }
@keyframes fall-b { to { transform: translate(18%, 18%) rotate(5deg); opacity: 0; visibility: hidden; } }
@keyframes fade-scar { to { opacity: 0.12; } }
@keyframes rise { to { opacity: 1; transform: none; } }

.replay {
  position: absolute;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 5;
  font: 500 0.8rem/1 var(--body);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--mist);
  background: transparent;
  border: 1px solid rgba(141, 138, 147, 0.4);
  border-radius: 999px;
  padding: 0.6rem 1rem;
  cursor: pointer;
}
.replay:hover { color: var(--steel); border-color: var(--steel); }
.replay:focus-visible { outline: 2px solid var(--crimson); outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  .half, .flash { display: none; }
  .slash { opacity: 0.12; }
  .slash line { stroke-dashoffset: 0; }
  .content .card { opacity: 1; transform: none; }
  .go .half, .go .slash, .go .slash line, .go .flash, .go .content .card, .go .katana { animation: none; }
  .replay { display: none; }
}
</style>
</head>
<body>

<main class="stage go" id="stage">
  <section class="content" aria-label="Domain owner">
    <div class="card">
      <span class="seal" aria-hidden="true">斬</span>
      <p class="domain">aiadoptlabs.com</p>
      <p class="lead">This domain now belongs to</p>
      <h1 class="owner">Goutam Mukku</h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="gloss">斬 zan · to cut through · registered November 2026</p>
    </div>
  </section>

  <div class="half a" aria-hidden="true">
    <svg id="art" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
      <defs>
        <radialGradient id="sun" cx="50%" cy="45%" r="55%">
          <stop offset="0%" stop-color="#d4183a"/>
          <stop offset="100%" stop-color="#7d0b1e"/>
        </radialGradient>
      </defs>
      <rect width="1000" height="1000" fill="#17151a"/>
      <circle cx="500" cy="440" r="250" fill="url(#sun)"/>
      <rect x="0" y="700" width="1000" height="300" fill="#0e0d10"/>
      <rect x="0" y="698" width="1000" height="3" fill="#2a262e"/>
      <text x="880" y="120" fill="#e4e6ea" fill-opacity="0.10" font-family="Shippori Mincho, serif" font-weight="800" font-size="170" style="writing-mode: vertical-rl">斬</text>
      <g transform="translate(390 330) scale(1.15)" fill="#0e0d10">
        <polygon points="20,92 100,52 180,92 100,84"/>
        <circle cx="100" cy="104" r="15"/>
        <polygon points="70,118 130,118 156,322 44,322"/>
        <polygon points="72,122 34,214 56,222 88,150"/>
        <polygon points="128,122 170,196 150,206 114,150"/>
        <rect x="68" y="168" width="64" height="11" fill="#c4122f"/>
        <g class="katana">
          <line x1="158" y1="198" x2="206" y2="10" stroke="#e4e6ea" stroke-width="4" stroke-linecap="round"/>
          <line x1="152" y1="206" x2="166" y2="190" stroke="#0e0d10" stroke-width="7" stroke-linecap="round"/>
        </g>
      </g>
    </svg>
  </div>
  <div class="half b" aria-hidden="true" id="halfB"></div>

  <div class="flash" aria-hidden="true"></div>
  <svg class="slash" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <line x1="100" y1="0" x2="0" y2="100" pathLength="1" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
  </svg>

  <button class="replay" id="replay" type="button">Cut again</button>
</main>

<script>
(function () {
  var stage = document.getElementById('stage');
  var art = document.getElementById('art');
  var halfB = document.getElementById('halfB');
  var copy = art.cloneNode(true);
  copy.removeAttribute('id');
  var grad = copy.querySelector('radialGradient');
  grad.id = 'sun-b';
  copy.querySelector('circle').setAttribute('fill', 'url(#sun-b)');
  halfB.appendChild(copy);

  document.getElementById('replay').addEventListener('click', function () {
    stage.classList.remove('go');
    void stage.offsetWidth;
    stage.classList.add('go');
  });
})();
</script>
</body>
</html>
